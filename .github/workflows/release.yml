name: Release

# Pushing a tag like v1.0.1 builds the installer on a Windows runner and publishes it as a GitHub Release.
# The app's built-in updater reads the latest release from the GitHub API.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches VERSION in the source
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path src\screenrec_studio.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\packaging\build.ps1 -Python python

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = (Select-String -Path src\screenrec_studio.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "ScreenRec Studio $version" }
          $sha = (Get-FileHash "dist\ScreenRecStudio-$version-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          # Ustte net bir "Download" bolumu (hangi dosya indirilecek), altta CHANGELOG'daki yenilikler
          $header = (Get-Content packaging\release_header.md -Raw -Encoding utf8).Replace("{VERSION}", $version).Replace("{SHA256}", $sha)
          $header + "`n" + $changes | Out-File release_notes.md -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ScreenRec Studio ${{ github.ref_name }}
          body_path: release_notes.md
          # Tek dosya: kullanici neyi indirecegini dusunmesin (SHA-256 aciklamada ve GitHub'in kendi listesinde)
          files: dist/ScreenRecStudio-*-Setup.exe

      - name: Upload build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/ScreenRecStudio-*-Setup.exe*
